<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>効果音ポン</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      background-color: #181825;
      color: #cdd6f4;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1e1e2e;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10;
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #f5e0dc;
      letter-spacing: 1px;
    }
    .container {
      flex: 1;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    .panel {
      background: linear-gradient(145deg, #313244, #45475a);
      border: 3px solid #585b70;
      border-radius: 16px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1e1e2e, 0 6px 10px rgba(0,0,0,0.4);
      transition: all 0.08s ease;
      word-break: break-word;
      line-height: 1.3;
    }
    .panel:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1e1e2e, 0 2px 4px rgba(0,0,0,0.4);
      background: linear-gradient(145deg, #f5c2e7, #cba6f7);
      color: #11111b;
      border-color: #fff;
    }
    footer {
      height: 60px;
      padding: 0 20px;
      background-color: #1e1e2e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }
    .nav-btn {
      background: #89b4fa;
      color: #11111b;
      border: none;
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 3px 0 #74c7ec;
      transition: all 0.1s ease;
    }
    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #74c7ec;
    }
    .nav-btn:disabled {
      background: #45475a;
      color: #6c7086;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .page-info {
      font-size: 1rem;
      font-weight: 800;
      color: #a6adc8;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔊 効果音ポン</h1>
  </header>

  <main class="container" id="panel-container">
    <!-- JSで動的生成 -->
  </main>

  <footer>
    <button class="nav-btn" id="prev-btn" onclick="changePage(-1)">◀ 前へ</button>
    <span class="page-info" id="page-info">1 / 5</span>
    <button class="nav-btn" id="next-btn" onclick="changePage(1)">次へ ▶</button>
  </footer>

  <script>
    // 古いキャッシュをクリア
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // sound1.mp3 〜 sound38.mp3 の完全対応リスト
    const soundList = [
      { "title": "アカン！", "file": "sound1.mp3" },
      { "title": "ええ加減にせんかい！", "file": "sound2.mp3" },
      { "title": "エクセレント", "file": "sound3.mp3" },
      { "title": "おぉ…！", "file": "sound4.mp3" },
      { "title": "お疲れ様でした", "file": "sound5.mp3" },
      { "title": "ぎくっ", "file": "sound6.mp3" },
      { "title": "グッド", "file": "sound7.mp3" },
      { "title": "こいつは厄介そうじゃな", "file": "sound8.mp3" },
      { "title": "ご清聴ありがとうございました", "file": "sound9.mp3" },
      { "title": "ご迷惑をおかけしております", "file": "sound10.mp3" },
      { "title": "すごいすごい", "file": "sound11.mp3" },
      { "title": "その調子その調子！", "file": "sound12.mp3" },
      { "title": "ちょっと…ふざけないでよ", "file": "sound13.mp3" },
      { "title": "ちょっとマズイかも…", "file": "sound14.mp3" },
      { "title": "ちょっと待てね", "file": "sound15.mp3" },
      { "title": "なんでやねん！", "file": "sound16.mp3" },
      { "title": "はっずれ～", "file": "sound17.mp3" },
      { "title": "ぴーんぽーんぱーんぽーん", "file": "sound18.mp3" },
      { "title": "ヒントだよ", "file": "sound19.mp3" },
      { "title": "ヒントです", "file": "sound20.mp3" },
      { "title": "もうええわ", "file": "sound21.mp3" },
      { "title": "結果発表", "file": "sound22.mp3" },
      { "title": "残念", "file": "sound23.mp3" },
      { "title": "少しはできそうですわね", "file": "sound24.mp3" },
      { "title": "惜しい", "file": "sound25.mp3" },
      { "title": "先を急ぎましょう", "file": "sound26.mp3" },
      { "title": "続きはWebで", "file": "sound27.mp3" },
      { "title": "当たり", "file": "sound28.mp3" },
      { "title": "ドックンドックン", "file": "sound29.mp3" },
      { "title": "なんでやねん", "file": "sound30.mp3" },
      { "title": "なんでやねん2", "file": "sound31.mp3" },
      { "title": "ピンポーン", "file": "sound32.mp3" },
      { "title": "ピンポンピンポン", "file": "sound33.mp3" },
      { "title": "ブブー", "file": "sound34.mp3" },
      { "title": "わーお", "file": "sound35.mp3" },
      { "title": "効果音36", "file": "sound36.mp3" },
      { "title": "効果音37", "file": "sound37.mp3" },
      { "title": "効果音38", "file": "sound38.mp3" }
    ];

    const ITEMS_PER_PAGE = 8;
    let currentPage = 0;
    const totalPages = Math.ceil(soundList.length / ITEMS_PER_PAGE);
    let currentAudio = null;

    function renderPanels() {
      const container = document.getElementById('panel-container');
      container.innerHTML = '';

      const startIndex = currentPage * ITEMS_PER_PAGE;
      const pageItems = soundList.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      pageItems.forEach(item => {
        const btn = document.createElement('div');
        btn.className = 'panel';
        btn.innerText = item.title;
        btn.onclick = () => playSound(item.file);
        container.appendChild(btn);
      });

      document.getElementById('page-info').innerText = `${currentPage + 1} / ${totalPages}`;
      document.getElementById('prev-btn').disabled = currentPage === 0;
      document.getElementById('next-btn').disabled = currentPage === totalPages - 1;
    }

    function changePage(direction) {
      currentPage += direction;
      if (currentPage < 0) currentPage = 0;
      if (currentPage >= totalPages) currentPage = totalPages - 1;
      renderPanels();
    }

    function playSound(filePath) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      
      const audioUrl = filePath + '?v=' + new Date().getTime();
      currentAudio = new Audio(audioUrl);
      
      currentAudio.play().catch(err => {
        alert("再生エラー:\nファイル: " + filePath + "\n内容: " + err.message);
      });
    }

    renderPanels();
  </script>
</body>
</html>
