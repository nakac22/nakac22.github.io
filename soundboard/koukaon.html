<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>効果音ポン</title>

  <!-- PWA基本設定 -->
  <meta name="theme-color" content="#1e1e2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="効果音ポン">

  <!-- インラインManifestデータ -->
  <link rel="manifest" id="manifest-placeholder">

  <!-- Google Fonts: 親しみやすい丸ゴシック（M PLUS Rounded 1c） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* 画面外へのハミ出しとスクロールを完全に防止 */
    }
    body {
      background-color: #181825;
      color: #cdd6f4;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1e1e2e;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10;
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #f5e0dc;
      letter-spacing: 1px;
    }
    .container {
      flex: 1;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }
    .panel {
      background: linear-gradient(145deg, #313244, #45475a);
      border: 3px solid #585b70;
      border-radius: 16px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1e1e2e, 0 6px 10px rgba(0,0,0,0.4);
      transition: all 0.08s ease;
      word-break: break-word;
      line-height: 1.3;
    }
    .panel:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1e1e2e, 0 2px 4px rgba(0,0,0,0.4);
      background: linear-gradient(145deg, #f5c2e7, #cba6f7);
      color: #11111b;
      border-color: #fff;
    }
    footer {
      height: 60px;
      padding: 0 20px;
      background-color: #1e1e2e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }
    .nav-btn {
      background: #89b4fa;
      color: #11111b;
      border: none;
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 3px 0 #74c7ec;
      transition: all 0.1s ease;
    }
    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #74c7ec;
    }
    .nav-btn:disabled {
      background: #45475a;
      color: #6c7086;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .page-info {
      font-size: 1rem;
      font-weight: 800;
      color: #a6adc8;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔊 効果音ポン</h1>
  </header>

  <main class="container" id="panel-container">
    <!-- JSで動的生成 -->
  </main>

  <footer>
    <button class="nav-btn" id="prev-btn" onclick="changePage(-1)">◀ 前へ</button>
    <span class="page-info" id="page-info">1 / 5</span>
    <button class="nav-btn" id="next-btn" onclick="changePage(1)">次へ ▶</button>
  </footer>

  <script>
    // 全35音のリスト（sounds/ フォルダ内のファイルを参照）
    const soundList = [
      { "title": "アカン！", "file": "sounds/「アカン！」.mp3" },
      { "title": "ええ加減にせんかい！", "file": "sounds/「ええかげんにせんかい！」.mp3" },
      { "title": "エクセレント", "file": "sounds/「エクセレント」.mp3" },
      { "title": "おぉ…！", "file": "sounds/「おぉ…！」.mp3" },
      { "title": "お疲れ様でした", "file": "sounds/「お疲れ様でした」.mp3" },
      { "title": "ぎくっ", "file": "sounds/「ぎくっ」.mp3" },
      { "title": "グッド", "file": "sounds/「グッド」.mp3" },
      { "title": "こいつは厄介そうじゃな", "file": "sounds/「こいつは厄介そうじゃな」.mp3" },
      { "title": "ご清聴ありがとうございました", "file": "sounds/「ご清聴ありがとうございました」.mp3" },
      { "title": "ご迷惑をおかけしております", "file": "sounds/「ご迷惑をおかけしております」.mp3" },
      { "title": "すごいすごい", "file": "sounds/「すごいすごい」.mp3" },
      { "title": "その調子その調子！", "file": "sounds/「その調子その調子！」.mp3" },
      { "title": "ちょっと…ふざけないでよ", "file": "sounds/「ちょっと…ふざけないでよ」.mp3" },
      { "title": "ちょっとマズイかも…", "file": "sounds/「ちょっとマズイかも…」.mp3" },
      { "title": "ちょっと待てね", "file": "sounds/「ちょっと待てね」.mp3" },
      { "title": "なんでやねん！", "file": "sounds/「なんでやねん！」.mp3" },
      { "title": "はっずれ～", "file": "sounds/「はっずれ～」.mp3" },
      { "title": "ぴーんぽーんぱーんぽーん", "file": "sounds/「ぴーんぽーんぱーんぽーん」.mp3" },
      { "title": "ヒントだよ", "file": "sounds/「ヒントだよ」.mp3" },
      { "title": "ヒントです", "file": "sounds/「ヒントです」.mp3" },
      { "title": "もうええわ", "file": "sounds/もうええわ.mp3" },
      { "title": "結果発表", "file": "sounds/結果発表.mp3" },
      { "title": "残念", "file": "sounds/残念.mp3" },
      { "title": "少しはできそうですわね", "file": "sounds/少しはできそうですわね.mp3" },
      { "title": "惜しい", "file": "sounds/惜しい.mp3" },
      { "title": "先を急ぎましょう", "file": "sounds/先を急ぎましょう.mp3" },
      { "title": "続きはWebで", "file": "sounds/続きはwebで.mp3" },
      { "title": "当たり", "file": "sounds/当たり.mp3" },
      { "title": "ドックンドックン", "file": "sounds/ドックンドックン.mp3" },
      { "title": "なんでやねん", "file": "sounds/なんでやねん.mp3" },
      { "title": "なんでやねん2", "file": "sounds/なんでやねん2.mp3" },
      { "title": "ピンポーン", "file": "sounds/ピンポーン.mp3" },
      { "title": "ピンポンピンポン", "file": "sounds/ピンポンピンポン.mp3" },
      { "title": "ブブー", "file": "sounds/ブブー.mp3" },
      { "title": "わーお", "file": "sounds/わーお.mp3" }
    ];

    const ITEMS_PER_PAGE = 8;
    let currentPage = 0;
    const totalPages = Math.ceil(soundList.length / ITEMS_PER_PAGE);
    let currentAudio = null;

    function renderPanels() {
      const container = document.getElementById('panel-container');
      container.innerHTML = '';

      const startIndex = currentPage * ITEMS_PER_PAGE;
      const pageItems = soundList.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      pageItems.forEach(item => {
        const btn = document.createElement('div');
        btn.className = 'panel';
        btn.innerText = item.title;
        btn.onclick = () => playSound(item.file);
        container.appendChild(btn);
      });

      document.getElementById('page-info').innerText = `${currentPage + 1} / ${totalPages}`;
      document.getElementById('prev-btn').disabled = currentPage === 0;
      document.getElementById('next-btn').disabled = currentPage === totalPages - 1;
    }

    function changePage(direction) {
      currentPage += direction;
      if (currentPage < 0) currentPage = 0;
      if (currentPage >= totalPages) currentPage = totalPages - 1;
      renderPanels();
    }

    function playSound(filePath) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      const encodedPath = filePath.split('/').map(part => encodeURIComponent(part)).join('/');
      currentAudio = new Audio(encodedPath);
      currentAudio.play().catch(err => console.error("再生エラー:", err));
    }

    // 初期表示
    renderPanels();

    // 動的Manifest生成
    const manifestData = {
      name: "効果音ポン",
      short_name: "効果音ポン",
      start_url: "./index.html",
      display: "standalone",
      background_color: "#181825",
      theme_color: "#1e1e2e"
    };
    const stringManifest = JSON.stringify(manifestData);
    const blobManifest = new Blob([stringManifest], {type: 'application/json'});
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blobManifest));

    // 動的Service Worker登録
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'soundboard-v1';
        self.addEventListener('install', (e) => {
          e.waitUntil(caches.open(CACHE_NAME));
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            caches.match(e.request).then((res) => res || fetch(e.request))
          );
        });
      `;
      const blobSW = new Blob([swCode], { type: 'text/javascript' });
      const swUrl = URL.createObjectURL(blobSW);
      navigator.serviceWorker.register(swUrl).catch(err => console.log('SW setup:', err));
    }
  </script>
</body>
</html>
