const AudioSys = {
  ctx: null,
  init() {
    if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  play(type) {
    this.init();
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    
    if(type === 'correct') {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.exponentialRampToValueAtTime(900, t + 0.15);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.linearRampToValueAtTime(0, t + 0.15);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.15);
    } 
    else if(type === 'combo') {
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc1.type = 'triangle'; osc2.type = 'sine';
      osc1.frequency.setValueAtTime(523.25, t); // C5
      osc1.frequency.setValueAtTime(659.25, t + 0.08); // E5
      osc2.frequency.setValueAtTime(783.99, t + 0.04); // G5
      osc2.frequency.setValueAtTime(1046.50, t + 0.12); // C6
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.linearRampToValueAtTime(0, t + 0.25);
      osc1.connect(gain); osc2.connect(gain);
      gain.connect(this.ctx.destination);
      osc1.start(t); osc1.stop(t + 0.25);
      osc2.start(t); osc2.stop(t + 0.25);
    } 
    else if(type === 'clear') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, t + idx * 0.08);
        gain.gain.setValueAtTime(0.15, t + idx * 0.08);
        gain.gain.linearRampToValueAtTime(0, t + idx * 0.08 + 0.3);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t + idx * 0.08); osc.stop(t + idx * 0.08 + 0.3);
      });
    } 
    else if(type === 'wrong') {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.linearRampToValueAtTime(80, t + 0.35);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.linearRampToValueAtTime(0, t + 0.35);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.35);
    }
    else if(type === 'gameover') {
      const notes = [300, 260, 220, 150];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, t + idx * 0.12);
        gain.gain.setValueAtTime(0.25, t + idx * 0.12);
        gain.gain.linearRampToValueAtTime(0, t + idx * 0.12 + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t + idx * 0.12); osc.stop(t + idx * 0.12 + 0.25);
      });
    }
  }
};

  load() {
    for(let i=0; i<6; i++) {
      this.stamps[i] = localStorage.getItem('moi_stamp_mid_' + i) === 'true';
      const el = document.getElementById('stamp-' + i);
      if(el) {
        if(this.stamps[i]) el.classList.add('active');
        else el.classList.remove('active');
      }
    }
  },
  unlock(unitIdx) {
    if(unitIdx >= 0 && unitIdx < 6) {
      this.stamps[unitIdx] = true;
      localStorage.setItem('moi_stamp_mid_' + unitIdx, 'true');
      this.load();
    }
  }
};

function speakSentence(wordsArray, callback) {
  if ('speechSynthesis' in window) {
    isReading = true;
    window.speechSynthesis.cancel();
    
    const sentence = wordsArray.join(" ");
    const utterance = new SpeechSynthesisUtterance(sentence);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    
    let called = false;
    const done = () => {
      if(!called) {
        called = true;
        clearTimeout(safeTimeout);
        isReading = false;
        callback();
      }
    };
    
    const safeTimeout = setTimeout(() => {
      done();
    }, 1500);
    
    utterance.onend = done;
    utterance.onerror = done;
    
    try {
      window.speechSynthesis.speak(utterance);
    } catch(e) {
      done();
    }
  } else {
    callback();
  }
}

function resize(){
  W=innerWidth; 
  H=innerHeight-180;
  cv.width=W; cv.height=H;
  if(p)p.y=H-35;
}
addEventListener('resize',resize);

function start(e){
  AudioSys.init();
  if('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance("");
    window.speechSynthesis.speak(u);
  }
  
  document.getElementById('menu').style.display='none';
  document.getElementById('gameover').style.display='none';
  document.getElementById('ui').style.display='block';
  resize();
  score=0; combo=0; life=3; idx=0; currentUnitIdx=0; isReading = false;
  p={x:W/2,y:H-35}; run=true;
  comboText.timer = 0;
  systemText.timer = 0;
  particles = [];
  load();
}

function restartGame() {
  document.getElementById('gameover').style.display='none';
  document.getElementById('ui').style.display='block';
  resize();
  score=0; combo=0; life=3; idx=0; currentUnitIdx=0; isReading = false;
  p={x:W/2,y:H-35}; run=true;
  comboText.timer = 0;
  systemText.timer = 0;
  particles = [];
  load();
}

function load(){
  document.querySelectorAll('.slot').forEach(x=>x.classList.remove('done'));
  exp=0; w=[]; b=[];
  
  let unit = UNIT_DATA[currentUnitIdx];
  let s = unit.data[idx % unit.data.length];
  
  let pos=[...Array(s.c.length).keys()].sort(()=>Math.random()-0.5);
  let segmentWidth = W / (s.c.length + 0.2);
  
  s.c.forEach((t,i)=>{
    w.push({
      t, 
      r:s.r[i], 
      o:i, 
      x: 10 + pos[i] * segmentWidth + (Math.random()*10 - 5), 
      y:40, 
      sd: 0.35 + Math.random() * 0.25, 
      h:false,
      ww: 90
    });
  });
}

function rolei(r){return ["だれ","する","なに","どこ","いつ"].indexOf(r)}

// 1タップごとの即時移動（ステップ移動）
function stepMove(d) {
  if (p) p.x = Math.max(18, Math.min(W - 18, p.x + d));
}

function shoot(e){
  if (e && e.preventDefault) e.preventDefault();
  AudioSys.init();
  if(run && p && !isReading) {
    b.push({x:p.x,y:p.y});
  }
}

// タップ・キーイベントの設定（長押し移動 & 連打・連続タップ対応）
const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnFire = document.getElementById('btn-fire');

function setupButton(btn, onAction, onHoldStart, onHoldEnd) {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    AudioSys.init();
    onAction();
    if(onHoldStart) onHoldStart();
  });
  btn.addEventListener('pointerup', (e) => {
    e.preventDefault();
    if(onHoldEnd) onHoldEnd();
  });
  btn.addEventListener('pointerleave', (e) => {
    e.preventDefault();
    if(onHoldEnd) onHoldEnd();
  });
  btn.addEventListener('pointercancel', (e) => {
    e.preventDefault();
    if(onHoldEnd) onHoldEnd();
  });
}

setupButton(btnLeft, () => stepMove(-25), () => { keys.left = true; }, () => { keys.left = false; });
setupButton(btnRight, () => stepMove(25), () => { keys.right = true; }, () => { keys.right = false; });
setupButton(btnFire, () => shoot(), null, null);

document.addEventListener('keydown', e => {
  if (e.key === "ArrowLeft") {
    if (!keys.left) stepMove(-25);
    keys.left = true;
  }
  if (e.key === "ArrowRight") {
    if (!keys.right) stepMove(25);
    keys.right = true;
  }
  if (e.key === " ") {
    if (!e.repeat) shoot();
  }
});

document.addEventListener('keyup', e => {
  if (e.key === "ArrowLeft") keys.left = false;
  if (e.key === "ArrowRight") keys.right = false;
});

function addParticles(x, y, color) {
  for(let i=0; i<12; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      r: Math.random() * 4 + 2,
      alpha: 1,
      color: color
    });
  }
}

function triggerComboText(comboCount) {
  AudioSys.play('combo');
  if (comboCount % 5 === 0) {
    let msg = comboCount + " COMBO!";
    if (comboCount === 5) msg = "NICE! 5 COMBO!";
    if (comboCount === 10) msg = "GREAT! 10 COMBO!";
    if (comboCount === 15) msg = "EXCELLENT! 15 COMBO!";
    if (comboCount >= 20) msg = "AMAZING! " + comboCount + " COMBO!";
    comboText = { txt: msg, timer: 60, scale: 1.8 };
  } else {
    comboText = { txt: comboCount + " COMBO!", timer: 45, scale: 1.3 };
  }
}

function update(){
  if(!run || !p) return; 

  // スムーズな連続移動
  const moveSpeed = 7;
  if (keys.left) p.x = Math.max(18, p.x - moveSpeed);
  if (keys.right) p.x = Math.min(W - 18, p.x + moveSpeed);
  
  if (!isReading) {
    w.forEach(x=>{
      if(!x.h) x.y += x.sd;
      if(x.y > H - 45){
        AudioSys.play('wrong');
        life--; combo=0; load();
      }
    });
    b.forEach(x => x.y -= 14);
  }
  
  b.forEach((bb, bi)=>{
    w.forEach(x=>{
      if(x.h) return;
      
      ctx.font = (W < 500 ? "15px" : "20px") + " Arial";
      let textW = ctx.measureText(x.t).width;
      let cardW = Math.max(95, textW + 40);
      let cardH = 46;
      x.ww = cardW;
      
      if(bb.x > x.x && bb.x < x.x + cardW && bb.y > x.y && bb.y < x.y + cardH){
        if(x.o === exp){
          x.h = true; 
          exp++; 
          combo++; 
          score += 20 + combo * 5;
          addParticles(bb.x, bb.y, '#2d7');
          
          if (combo >= 2) {
            triggerComboText(combo);
          } else {
            AudioSys.play('correct');
          }
          
          let ri = rolei(x.r); 
          if(ri >= 0) document.getElementById('s' + ri).classList.add('done');
          
          if(exp === w.length){
            score += 100;
            
            let unit = UNIT_DATA[currentUnitIdx];
            let currentSentenceData = unit.data[idx % unit.data.length].c;
            
            speakSentence(currentSentenceData, () => {
              idx++;
              let currentUnit = UNIT_DATA[currentUnitIdx];
              if(idx >= currentUnit.data.length) {
                StampSys.unlock(currentUnitIdx);
                AudioSys.play('clear');
                
                let stampName = currentUnit.stamps[0] || "マスター";
                systemText = { txt: stampName + " 獲得！", timer: 120 };
                
                if(currentUnitIdx < UNIT_DATA.length - 1) {
                  currentUnitIdx++;
                  idx = 0;
                } else {
                  currentUnitIdx = 0;
                  idx = 0;
                }
              }
              load();
            });
          }
        } else {
          AudioSys.play('wrong');
          addParticles(bb.x, bb.y, '#f33');
          life--; 
          combo = 0;
        }
        b.splice(bi, 1);
      }
    });
  });
  
  b = b.filter(x => x.y > 0);
  
  particles.forEach(pt => {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.alpha -= 0.02;
  });
  particles = particles.filter(pt => pt.alpha > 0);
  
  if(comboText.timer > 0) comboText.timer--;
  if(systemText.timer > 0) systemText.timer--;
  
  if(life <= 0){
    run = false;
    AudioSys.play('gameover');
    let best = Math.max(score, +(localStorage.getItem('moi_best_mid')||0));
    localStorage.setItem('moi_best_mid', best);
    document.getElementById('best').textContent = "Best Score: " + best;
    
    document.getElementById('final-score').textContent = score;
    document.getElementById('ui').style.display = 'none';
    document.getElementById('gameover').style.display = 'flex';
  }
  
  document.getElementById('unit-display').textContent = (currentUnitIdx + 1) + " (" + UNIT_DATA[currentUnitIdx].name + ")";
  document.getElementById('score').textContent = score;
  document.getElementById('combo').textContent = combo;
  document.getElementById('life').textContent = life;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(!run || !p) return;
  
  ctx.strokeStyle = "rgba(22, 35, 58, 0.4)";
  ctx.lineWidth = 1;
  for(let x = 0; x < W; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  
  ctx.font = (W < 500 ? "15px" : "20px") + " Arial";
  w.forEach(x=>{
    if(x.h)return;
    
    let textW = ctx.measureText(x.t).width;
    let cardW = Math.max(95, textW + 40);
    let cardH = 46;
    x.ww = cardW;
    
    ctx.fillStyle = "#12223c";
    ctx.fillRect(x.x, x.y, cardW, cardH);
    
    ctx.strokeStyle = "#47a";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x.x, x.y, cardW, cardH);
    
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(x.t, x.x + (cardW / 2), x.y + (cardH / 2) + 1);
  });
  
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  
  b.forEach(x => {
    ctx.fillStyle = "#fff";
    ctx.fillRect(x.x - 2, x.y, 4, 12);
    ctx.shadowBlur = 8; ctx.shadowColor = "yellow";
    ctx.fillStyle = "yellow";
    ctx.fillRect(x.x - 1, x.y, 2, 12);
    ctx.shadowBlur = 0;
  });
  
  ctx.fillStyle = "#6cf";
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x - 18, p.y + 22);
  ctx.lineTo(p.x + 18, p.y + 22);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillRect(p.x - 2, p.y + 4, 4, 4);
  
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = pt.alpha;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;
  
  if(comboText.timer > 0) {
    ctx.save();
    ctx.translate(W / 2, H / 2 - 30);
    let progress = (60 - comboText.timer) / 60;
    let currentScale = comboText.scale * (1 + Math.sin(progress * Math.PI) * 0.15);
    ctx.scale(currentScale, currentScale);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 26px Arial";
    
    ctx.fillStyle = "#000";
    ctx.fillText(comboText.txt, 2, 2);
    ctx.fillStyle = "#fa0";
    ctx.shadowBlur = 10; ctx.shadowColor = "#fa0";
    ctx.fillText(comboText.txt, 0, 0);
    ctx.restore();
  }
  
  if(systemText.timer > 0) {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 26px 'Courier New', Arial, sans-serif";
    
    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.fillRect(0, H/2 - 50, W, 100);
    
    ctx.fillStyle = "#2d7";
    ctx.shadowBlur = 15; ctx.shadowColor = "#2d7";
    ctx.fillText(systemText.txt, W / 2, H / 2);
    ctx.restore();
  }
}

(function loop(){update();draw();requestAnimationFrame(loop)})();
resize();

StampSys.load();
document.getElementById('best').textContent = "Best Score: " + (localStorage.getItem('moi_best_mid') || 0);

document.addEventListener('touchstart', (e) => {
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: false });

let lastTouchTime = 0;
document.addEventListener('touchend', (e) => {
  const now = (new Date()).getTime();
  if (now - lastTouchTime <= 300) {
    e.preventDefault();
  }
  lastTouchTime = now;
}, { passive: false });
</script>
</body>
</html>
