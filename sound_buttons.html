<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>効果音ボタン</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { margin-bottom: 25px; font-size: 24px; color: #eeeeee; }
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 360px;
    }
    .sound-btn {
      width: 100%;
      padding: 22px 15px;
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .sound-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
    }
    .btn-bus { background: linear-gradient(135deg, #e63946, #d62828); border-left: 6px solid #ff9999; }
    .btn-result { background: linear-gradient(135deg, #f72585, #7209b7); border-left: 6px solid #ff99dd; }
    .btn-mate { background: linear-gradient(135deg, #ff9f1c, #ffbf69); color: #111; border-left: 6px solid #fff200; }
    
    /* 画面上に動画枠を出さないための非表示設定 */
    .media-element { display: none; }
  </style>
</head>
<body>

  <h1>🔊 サウンドボタン</h1>

  <div class="button-container">
    <button class="sound-btn btn-bus" onclick="playMedia('media-bus')">次、止まります</button>
    <button class="sound-btn btn-result" onclick="playMedia('media-result')">結果発表</button>
    <button class="sound-btn btn-mate" onclick="playMedia('media-mate')">ちょっと待てぃ</button>
  </div>

  <!-- 動画(.mov)と音声(.mp3)をそれぞれ正しく要素として配置 -->
  <video id="media-bus" src="bus.mov" class="media-element" playsinline></video>
  <video id="media-result" src="result.mov" class="media-element" playsinline></video>
  <audio id="media-mate" src="mate.mp3" class="media-element" playsinline></audio>

  <script>
    function playMedia(id) {
      const el = document.getElementById(id);
      if (el) {
        el.currentTime = 0;
        el.play().catch(err => {
          console.error("再生エラー:", err);
          alert("再生に失敗しました。ファイル名や拡張子(.mov / .mp3)を確認してください。");
        });
      }
    }
  </script>

</body>
</html>
